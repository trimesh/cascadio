[build-system]
requires = ["scikit_build_core >= 0.11", "nanobind >= 2.2"]
build-backend = "scikit_build_core.build"

[project]
name = "cascadio"
version = "0.2.0rc0"
requires-python = ">=3.12"
authors = [{name = "Michael Dawson-Haggerty", email = "mikedh@kerfed.com"}]
# cascadio is MIT; wheels also contain OpenCASCADE (LGPL 2.1 with an
# exception) and the Zstandard decompressor (BSD). All three texts ship
# in the wheel.
license = "MIT AND LGPL-2.1-only WITH OCCT-exception-1.0 AND BSD-3-Clause"
license-files = ["LICENSE/LICENSE-*.md"]
description = "Convert STEP and IGES files to GLB using OpenCASCADE"
keywords = ["graphics", "STEP", "IGES", "GLTF"]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Natural Language :: English",
    "Topic :: Scientific/Engineering",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Multimedia :: Graphics :: 3D Modeling"
]
urls = {Homepage = "https://github.com/trimesh/cascadio"}

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.optional-dependencies]
tests = ["pytest", "trimesh", "chardet", "jsonschema"]

# Every tool that takes part in producing a wheel. uv.lock pins each one,
# and everything they depend on, to an exact version with sha256 hashes,
# and wheel builds refuse anything that does not match.
# After changing this list, or to take updates: `uv lock --upgrade`.
[dependency-groups]
build = [
    "scikit-build-core>=0.11",
    "nanobind>=2.2",
    "cmake>=3.29",
    "ninja",
    "abi3audit",
    "delvewheel; sys_platform == 'win32'",
]

[tool.scikit-build]
cmake.version = ">=3.29"
wheel.packages = ["src/cascadio"]
wheel.exclude = ["**/__pycache__"]
wheel.py-api = "cp312"
# The source distribution leaves out the vendored libraries, so it stays
# small and builds against the system's OpenCASCADE 7.9+, RapidJSON and zstd.
sdist.exclude = ["upstream", "occt_install", "build", "wheelhouse", ".github"]

[tool.cibuildwheel]
# cibuildwheel goes through the same Makefile as local development:
# `make occt` builds OpenCASCADE and `make audit` checks each wheel, both
# with the tools pinned in uv.lock. `make occt` also writes
# build-constraints.txt from the lock, which pins the tools of the wheel
# build itself. The workflow installs a pinned uv.
#
# Setting `environment` anywhere else (a platform section, CIBW_ENVIRONMENT*)
# replaces this table, so UV_CONSTRAINT has to be repeated there.
build-frontend = "build[uv]"
environment = { UV_CONSTRAINT = "build-constraints.txt" }
# `yum` would need to be replaced in the `before-all`
# script before the musl linux can build OpenCASCADE
skip = "*musl* *win32*"

# manylinux_2_28 has a C++17 standard library new enough for OCCT 8
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"

# Skip testing on i686 (32-bit is not supported)
test-skip = "*i686"

# Build static OpenCASCADE once per platform (skipped when cached)
before-all = "make occt"

test-extras = "tests"
test-command = "pytest {project}/tests"

[tool.cibuildwheel.linux]
# clang + lld: same compiler on every platform, and lld folds duplicate code
before-all = [
  "yum install -y bubblewrap clang lld llvm",
  "make occt",
]
container-engine = "docker; create_args: --privileged"
repair-wheel-command = [
  "auditwheel repair -w {dest_dir} {wheel}",
  "make audit WHEEL={wheel}"
]
# Run normal tests, then test with read-only root filesystem via bubblewrap
# Uses bwrap to create a read-only bind mount with /proc for memfd support
test-command = "pytest {project}/tests && bwrap --ro-bind / / --dev /dev --proc /proc --unshare-user --uid 1000 --gid 1000 python {project}/scripts/test_readonly.py"

[tool.cibuildwheel.windows]
# The Windows CI image has no `make`, so these are the Makefile's
# `occt` and `audit` recipes written out.
before-all = [
  "uv export --frozen --only-group build --no-emit-project -o build-constraints.txt",
  "uv run --frozen --only-group build python scripts/build_occt.py",
]
repair-wheel-command = [
  "uv run --frozen --only-group build delvewheel repair -w {dest_dir} {wheel}",
  "uv run --frozen --only-group build python scripts/audit_wheel.py {wheel}"
]

[tool.cibuildwheel.macos]
# Require macOS 10.15+ for std::filesystem support
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0", UV_CONSTRAINT = "build-constraints.txt" }
repair-wheel-command = [
  "delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel}",
  "make audit WHEEL={wheel}"
]
