name: Build And Release Wheels

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# default to no permissions, jobs request only what they need
permissions: {}

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Get OCCT cache key
        id: occt-key
        shell: bash
        env:
          FILES_HASH: ${{ hashFiles('patches/*.patch', 'scripts/build_occt.py') }}
        run: |
          # Cache key includes: OS, OCCT commit, patches, and build script
          OCCT_COMMIT=$(git rev-parse HEAD:upstream/OCCT)
          echo "hash=${RUNNER_OS}-${OCCT_COMMIT}-${FILES_HASH}" >> "$GITHUB_OUTPUT"

      # Only pull requests restore the OCCT cache: wheels published from
      # `main` always build OCCT from source so a poisoned cache entry
      # can never end up in a release. PRs can read caches saved by `main`.
      - name: Restore OCCT build
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            upstream/OCCT/lin64
            upstream/OCCT/lin32
            upstream/OCCT/win64
            upstream/OCCT/mac64
          key: occt-${{ steps.occt-key.outputs.hash }}

      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Build wheels
        uses: pypa/cibuildwheel@8c2dcd2e96041a619f5ff03c9638d7941e2553a4 # v4.3.3
        with:
          output-dir: wheelhouse

      - name: Save OCCT build
        if: always() && github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            upstream/OCCT/lin64
            upstream/OCCT/lin32
            upstream/OCCT/win64
            upstream/OCCT/mac64
          key: occt-${{ steps.occt-key.outputs.hash }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ./wheelhouse/*.whl
          name: wheels-${{ matrix.os }}

  upload_all:
    name: Upload To PyPi
    needs: build_wheels
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: pypi
      url: https://pypi.org/p/cascadio
    permissions:
      id-token: write
    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: wheels-*
        merge-multiple: true
        path: dist
    - name: Publish
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  release:
    permissions:
      contents: write  # for `gh release create`
    name: Create GitHub Release
    needs: [upload_all]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          gh release create "$VER" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Release $VER" --notes ""
