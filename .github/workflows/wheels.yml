name: Build And Release Wheels

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Get OCCT cache key
        id: occt-key
        shell: bash
        run: echo "commit=$(git rev-parse HEAD:upstream/OCCT)" >> $GITHUB_OUTPUT

      # The static OpenCASCADE build takes most of the job, so keep it
      # between runs. It only changes with the OCCT commit or how we build it.
      - name: Cache OCCT build
        uses: actions/cache@v4
        with:
          path: occt_install
          key: occt-${{ runner.os }}-${{ runner.arch }}-${{ steps.occt-key.outputs.commit }}-${{ hashFiles('scripts/build_occt.py', 'cmake/toolchain.cmake') }}

      - uses: ilammy/msvc-dev-cmd@v1.13.0

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.4.1
        with:
          output-dir: wheelhouse
        env:
          # Linux wheels build in a container that sees the runner's disk
          # at /host. Installing OpenCASCADE there lets the cache step keep it.
          CIBW_ENVIRONMENT_LINUX: CASCADIO_OCCT_PREFIX=/host${{ github.workspace }}/occt_install

      - uses: actions/upload-artifact@v4
        with:
          path: ./wheelhouse/*.whl
          name: wheels-${{ matrix.os }}

  upload_all:
    name: Upload To PyPi
    needs: build_wheels
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      # The source distribution leaves out the vendored OpenCASCADE; it is
      # what Linux and BSD packagers build against their system's copy.
      - name: Build source distribution
        run: pipx run build --sdist
      - name: Publish
        uses: pypa/gh-action-pypi-publish@v1.8.12

  release:
    permissions:
      contents: write  # for actions/create-release
    name: Create GitHub Release
    needs: [build_wheels]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Tag Version
        id: set_tag
        run: |
          export VER=$(python -c "print(next(eval(L.split('=')[-1]) for L in open('pyproject.toml') if L.startswith('version ')))")
          echo "::set-output name=tag_name::${VER}"
      - name: Create Release
        id: create_release
        uses: actions/create-release@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.set_tag.outputs.tag_name }}
          release_name: Release ${{ steps.set_tag.outputs.tag_name }}
          draft: false
          prerelease: false
